# Optional example helpers you can use to try the card out or as a
# reference for wiring it to your real recuperator entities.
# Add this to configuration.yaml (or split into packages) and restart HA.

input_select:
  recuperator_mode:
    name: Recuperator mode
    icon: mdi:fan
    options:
      - "off"
      - building_protection
      - economy
      - comfort
      - boost
    initial: "off"

  # Optional: only needed if you want language/theme to persist across
  # devices instead of being stored per-browser.
  recuperator_language:
    name: Recuperator language
    icon: mdi:translate
    options:
      - en
      - ru
      - lv
    initial: en

  recuperator_theme:
    name: Recuperator theme
    icon: mdi:theme-light-dark
    options:
      - auto
      - light
      - dark
    initial: auto

# Replace these with template sensors pointing at your real
# recuperator/HRV integration, or delete them once real entities exist.
template:
  - sensor:
      - name: Recuperator Fan Speed
        unique_id: recuperator_fan_speed
        unit_of_measurement: "%"
        state: "65"
      - name: Recuperator Heat Recovery
        unique_id: recuperator_heat_recovery
        unit_of_measurement: "%"
        state: "82"
      - name: Recuperator Outdoor Temperature
        unique_id: recuperator_outdoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "4.2"
      - name: Recuperator Supply Temperature
        unique_id: recuperator_supply_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "19.8"
      - name: Recuperator Indoor Temperature
        unique_id: recuperator_indoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "21.3"
